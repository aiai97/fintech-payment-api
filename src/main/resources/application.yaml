spring:
  rabbitmq:
    host: ${RABBIT_HOST:localhost} # in real world, it is not right to write password and it should be in a secret manager or environment variable
    port: ${RABBIT_PORT:5673}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        trusted-packages: com.pay.payment_api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/payment_db}
    username: ${DB_USER:payment_user}
    password: ${DB_PASSWORD:payment_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true